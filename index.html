<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Planner</title>
<meta name="theme-color" content="#0c0916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: fixed sidebar + dashboard grid on desktop; one column + bottom tab bar on phone */
  --bg:#0c0916;
  --surface:#151024;
  --surface-2:#1e1733;
  --line:#2b2244;
  --ink:#eeeaf8;
  --muted:#978eb4;
  --accent:#9d6bff;
  --accent-soft:rgba(157,107,255,.16);
  --sunset:#ff8a5c;
  --ok:#3fd99a; --warn:#ffb648; --bad:#ff5f7e; --sky:#5aa7ff; --pink:#ff6fb5;
  --display:'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --hand:'Caveat','Segoe Script','Bradley Hand',cursive;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:24px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,#120d22,#0c0916)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#2b1a55,#160e2e);border:1px solid #3a2c63}
.brand h1{font-family:var(--display);font-size:30px;letter-spacing:.5px;line-height:1}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;border:1px solid transparent}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--accent-soft);border-color:#4a3590}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px;padding:0 8px}
.side-quote{font-family:var(--hand);font-size:22px;line-height:1.1;color:#cdbff5}
.side-quote::after{content:"";display:block;width:34px;height:2px;margin-top:10px;background:var(--accent)}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.sync[data-s="ok"] i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync[data-s="local"] i{background:var(--muted)}
.sync[data-s="err"] i{background:var(--bad)}
.ghost-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.ghost-btn:hover{color:var(--ink);border-color:#463a6c}
.main{min-width:0;padding:24px 28px 60px;display:flex;flex-direction:column;gap:20px}
.tabbar{display:none}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
.brand h1{white-space:nowrap}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.card-h h2 .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.card-h h2 .ic svg{width:17px;height:17px}
.card-h .sub{color:var(--muted);font-size:12.5px;font-weight:600}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h1{font-family:var(--display);font-size:46px;letter-spacing:.5px;line-height:.95}
.page-h p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.empty a{color:var(--accent);font-weight:700;text-decoration:none}
.btn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:rgba(255,95,126,.14);color:var(--bad);border:1px solid rgba(255,95,126,.35)}
.icon-btn{background:none;border:0;color:var(--muted);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.in{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{resize:vertical;min-height:84px}
.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.form-row .field{flex:1 1 130px}
.form-row .field.wide{flex:3 1 220px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%}
.chip.p-alta{background:rgba(255,95,126,.15);color:var(--bad)}
.chip.p-media{background:rgba(255,182,72,.14);color:var(--warn)}
.chip.late{background:rgba(255,95,126,.15);color:var(--bad)}
.chip.today{background:var(--accent-soft);color:#c7b0ff}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{white-space:nowrap;background:none;border:0;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.pickers{display:flex;flex-wrap:wrap;gap:6px}
.pickers label{position:relative}
.pickers input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pickers span{display:inline-block;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:700;color:var(--muted)}
.pickers input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.pickers input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- hero ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:230px;border:1px solid #33265a;display:flex}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;width:100%;padding:26px 28px;background:linear-gradient(90deg,rgba(12,9,22,.72),rgba(12,9,22,.15) 60%,rgba(12,9,22,0))}
.hero .eyebrow{font-size:12.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#d9cbff}
.hero h1{font-family:var(--display);font-size:clamp(40px,6vw,66px);line-height:.92;letter-spacing:.5px;margin-top:6px}
.hero .motto{font-family:var(--hand);font-size:25px;color:#ffd2bd;margin-top:8px;line-height:1.1}
.flip{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.flip-row{display:flex;gap:8px}
.tile{position:relative;width:86px;height:96px;border-radius:12px;background:linear-gradient(180deg,#221a36 0 50%,#1a1429 50% 100%);border:1px solid #3a2e5c;display:grid;place-items:center;font-family:var(--display);font-size:72px;line-height:1;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#0c0916}
.tile span{transform:translateY(3px)}
.flip-day{font-family:var(--display);font-size:20px;letter-spacing:2px;color:#cbbcf7}

/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff}
.stat .ic svg{width:19px;height:19px}
.stat .lab{color:var(--muted);font-size:13px;font-weight:600}
.stat .big{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:.5px}
.stat .foot{font-size:12px;color:var(--muted);font-weight:600}
.stat .foot b{color:var(--ok)}
.ring{width:38px;height:38px}

/* ---------- tasks ---------- */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 8px 9px 10px;border-radius:11px;background:var(--bg);border:1px solid var(--line)}
.task .check{width:20px;height:20px;border-radius:6px;border:2px solid #4b3d78;background:none;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.task .check:hover{border-color:var(--accent)}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.task-title{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips:empty{display:none}
.quick{display:flex;gap:8px;margin-top:10px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.col-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.col-h .count{margin-left:auto;font-size:12px;background:var(--surface-2);border-radius:99px;padding:1px 8px;color:var(--ink)}
.done-list{margin-top:6px}
.done-list summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;padding:6px 0}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:8px}
.tl-item{display:grid;grid-template-columns:52px 4px 1fr;gap:10px;align-items:stretch}
.tl-time{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:9px;text-align:right}
.tl-bar{border-radius:4px}
.tl-body{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 11px;display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.tl-body b{font-size:14px;display:block;overflow-wrap:anywhere}
.tl-body small{color:var(--muted);font-size:12px}
.tl-item.now .tl-body{border-color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent)}
.tl-item.past{opacity:.5}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent);color:#fff;white-space:nowrap}
.tag.next{background:var(--surface-2);color:var(--muted)}

/* ---------- focus ---------- */
.focus-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.focus-ring{position:relative;width:170px;height:170px}
.focus-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.focus-ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.focus-ring .t b{font-family:var(--display);font-size:50px;line-height:1;letter-spacing:1px;display:block}
.focus-ring .t small{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.focus-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- habits ---------- */
.hab-list{display:flex;flex-direction:column;gap:8px}
.hab{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--bg);border:1px solid var(--line)}
.hab-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.hab-name{flex:1;min-width:0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.hab-name small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.hcheck{width:28px;height:28px;border-radius:50%;border:2px solid #4b3d78;background:none;flex:none;display:grid;place-items:center;padding:0}
.hcheck:hover:not(:disabled){border-color:var(--ok)}
.hcheck.on{background:var(--ok);border-color:var(--ok)}
.hcheck.on::after{content:"";width:6px;height:11px;border:solid #0c0916;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.hcheck:disabled{opacity:.25;cursor:default}
.hcheck.sm{width:24px;height:24px}
.hgrid{width:100%;border-collapse:separate;border-spacing:0 8px}
.hgrid th{font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:0 2px}
.hgrid th:first-child{text-align:left}
.hgrid th.today{color:var(--accent)}
.hgrid td{text-align:center;padding:0 2px}
.hgrid td:first-child{text-align:left}
.streak{font-size:12px;font-weight:800;color:var(--sunset);white-space:nowrap}

/* ---------- goals ---------- */
.goal{display:flex;flex-direction:column;gap:10px}
.goal-top{display:flex;gap:12px;align-items:flex-start}
.goal-top h3{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.goal-top p{margin:2px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.goal-meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;gap:8px;flex-wrap:wrap}
.goal-pct{font-family:var(--display);font-size:30px;color:var(--ink);line-height:1}
.goal-ctrl{display:flex;align-items:center;gap:8px}
.goal-ctrl input[type=range]{flex:1;accent-color:var(--accent)}
.mini-goal{display:flex;flex-direction:column;gap:6px}
.mini-goal .row{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;gap:8px}
.mini-goal .row span:last-child{color:var(--muted)}

/* ---------- schedule ---------- */
.week{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));gap:6px;min-width:760px}
.week-scroll{overflow-x:auto}
.wk-h{text-align:center;font-weight:800;font-size:12.5px;color:var(--muted);padding-bottom:6px}
.wk-h.today{color:var(--accent)}
.wk-axis{position:relative}
.wk-axis span{position:absolute;right:4px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.wk-col{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour)}
.wk-col.today{border-color:#4a3590}
.blk{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 6px;font-size:11.5px;line-height:1.2;overflow:hidden;text-align:left;border:0;color:#fff;border-left:3px solid rgba(255,255,255,.55)}
.blk{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.blk b{display:block;font-size:12px}
.blk:hover{filter:brightness(1.15)}
.blk.opt{background-image:repeating-linear-gradient(135deg,rgba(12,9,22,.38) 0 6px,transparent 6px 12px);opacity:.78;border-left-style:dashed}
.opt-tag{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:rgba(0,0,0,.3);border-radius:4px;padding:0 4px;margin-left:3px}
.tl-item.opt .tl-bar{background-image:repeating-linear-gradient(180deg,rgba(12,9,22,.6) 0 4px,transparent 4px 8px)}
.chip.opt{background:transparent;border:1px dashed var(--muted)}
.mday{display:none}
.daytabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.daytabs button{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 0;font-weight:700;font-size:13px;color:var(--muted)}
.daytabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.cal-d{min-height:92px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.cal-d.out{opacity:.35}
.cal-d.sel{border-color:var(--accent)}
.cal-d .n{font-size:12.5px;font-weight:800;color:var(--muted);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal-d.today .n{background:var(--accent);color:#fff}
.cal-ev{font-size:11px;font-weight:700;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.cal-more{font-size:11px;color:var(--muted);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}

/* ---------- journal ---------- */
.moods{display:flex;gap:6px;flex-wrap:wrap}
.entry{border-left:4px solid var(--accent);padding:10px 14px;background:var(--bg);border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:4px}
.entry-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry-h b{font-size:13px}
.entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.entry .good{color:#ffd2bd;font-size:13px}
.mood-strip{display:flex;gap:5px;align-items:flex-end;height:58px}
.mood-strip div{flex:1;border-radius:5px 5px 2px 2px;background:var(--surface-2);min-height:4px}
.notes{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;line-height:1.5}
.notes:focus{outline:none;border-color:var(--accent)}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(5,3,12,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-box h2{font-size:18px}
.modal-box p{margin:0;color:var(--muted);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#241b3d;border:1px solid #4a3590;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:var(--accent);font-weight:800}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}

  .main{padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
  .g3,.g2,.cols{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(17,12,31,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:700;padding:5px 0;border-radius:10px}
  .tabbar a[aria-current="page"]{color:#fff}
  .tabbar a[aria-current="page"] svg{color:var(--accent)}
  .tabbar svg{width:21px;height:21px}
  .mobile-top{display:flex !important}
  .hero{min-height:200px}
  .hero-in{flex-direction:column;align-items:flex-start;padding:20px}
  .flip{align-items:flex-start;flex-direction:row;align-items:center;gap:12px}
  .tile{width:58px;height:64px;font-size:46px;border-radius:9px}
  .flip-day{font-size:16px}
  .week-scroll{display:none}
  .mday{display:block}
  .cal{gap:3px}
  .cal-d{min-height:50px;padding:4px 2px;flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:3px;border-radius:8px}
  .cal-d .n{width:24px;margin:0 calc((100% - 24px) / 2);font-size:12px}
  .add-card summary .sub{display:none}
  .cal-ev{font-size:0;width:6px;height:6px;padding:0;border-radius:50%;flex:none}
  .cal-more{display:none}
  .cal-h{font-size:11px}
  .legend{gap:8px}
  .page-h h1{font-size:38px}
}
@media (max-width:860px) and (display-mode:browser){
  .tabbar{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 4px 6px}
  body .main{padding-top:calc(84px + env(safe-area-inset-top));padding-bottom:40px}
  .fab{bottom:calc(32px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom))}
}

.mobile-top{display:none;justify-content:space-between;align-items:center}

/* ---------- assistant ---------- */
.fab{position:fixed;right:24px;bottom:24px;z-index:45;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#9d6bff,#ff8a5c);color:#fff;border:0;border-radius:999px;padding:14px 20px 14px 16px;font-weight:800;font-size:15px;box-shadow:0 12px 30px rgba(157,107,255,.45)}
.fab svg{width:22px;height:22px}
.fab:hover{filter:brightness(1.08)}
.mic{width:64px;height:64px;border-radius:50%;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;flex:none;border:2px solid var(--line)}
.mic svg{width:28px;height:28px}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,95,126,.55)}70%{box-shadow:0 0 0 16px rgba(255,95,126,0)}100%{box-shadow:0 0 0 0 rgba(255,95,126,0)}}
.a-row{display:flex;gap:14px;align-items:center}
.a-hint{font-size:13px;color:var(--muted)}
.a-partial{font-size:13px;color:#c7b0ff;font-style:italic;min-height:18px}
.a-list{display:flex;flex-direction:column;gap:8px}
.a-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:11px;background:var(--bg);border:1px solid var(--line);cursor:pointer}
.a-item input{margin-top:3px;accent-color:var(--accent);width:17px;height:17px;flex:none}
.a-item b{font-size:14px;display:block;overflow-wrap:anywhere}
.a-item small{color:var(--muted);font-size:12px}
.a-kind{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap;flex:none}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.thinking i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
@media (max-width:860px){.toast{bottom:calc(150px + env(safe-area-inset-bottom))}.fab{right:16px;bottom:calc(84px + env(safe-area-inset-bottom));padding:15px}.fab span{display:none}}
.login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at top,#2a1650,#0c0916 65%)}
.login[hidden]{display:none}
.login-box{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login-box p{margin:0;color:var(--muted);font-size:14px}
.main{padding-top:max(24px,env(safe-area-inset-top))}
.quote{margin:0 0 14px;padding:4px 0 4px 16px;border-left:3px solid var(--sunset)}
.quote p{margin:0;font-family:var(--hand);font-size:27px;line-height:1.15;color:#f1e6ff;text-wrap:balance}
.quote cite{display:block;margin-top:8px;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.quote-card .done-list{margin-top:10px}
.mflip{perspective:1400px}
.mflip .inner{display:grid;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.mflip.flipped .inner{transform:rotateY(180deg)}
.mflip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-width:0}
.mflip .face.back{transform:rotateY(180deg)}
.mflip:not(.flipped) .face.back,.mflip.flipped .face.front{pointer-events:none}
.m-q{font-size:18px;line-height:1.55;margin-bottom:16px;overflow-wrap:anywhere}
.m-q small{font-size:12.5px;color:var(--muted)}
.m-q sup,.m-steps sup{font-size:.72em}
.m-opts{display:grid;gap:8px}
.m-opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-weight:600;font-size:14.5px}
.m-opt:hover:not(:disabled){border-color:var(--accent)}
.m-opt:disabled{cursor:default}
.m-opt.right{border-color:var(--ok);background:rgba(63,217,154,.12)}
.m-opt.wrong{border-color:var(--bad);background:rgba(255,95,126,.12)}
.m-fb{margin-top:12px;font-size:14px}
.m-fb.ok b{color:var(--ok)}
.m-fb.no>b:first-child{color:var(--bad)}
.m-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:14.5px;line-height:1.5}
.m-steps li::marker{color:var(--accent);font-weight:800}
.add-card summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.add-card summary::-webkit-details-marker{display:none}
.add-card summary .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.add-card summary .ic svg{width:17px;height:17px}
.add-card summary .sub{color:var(--muted);font-size:12.5px;font-weight:600}
@media(max-width:860px){#calGrid,#jGrid,#mGrid{grid-template-columns:1fr !important}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

const MOODS=[{v:1,n:'Mal',c:'#ff5f7e'},{v:2,n:'Meh',c:'#ff8a5c'},{v:3,n:'Normal',c:'#ffb648'},{v:4,n:'Bien',c:'#5aa7ff'},{v:5,n:'Top',c:'#3fd99a'}];
const QUOTES=[{"t":"La memoria es mala archivista: anota.","a":"Para pensar"},{"t":"Nadie se acuerda de cuántas veces fallaste, solo de la vez que te salió.","a":"Para pensar"},{"t":"Nada en la vida debe ser temido, solo comprendido.","a":"Marie Curie"},{"t":"Un problema bien planteado está medio resuelto.","a":"Charles Kettering"},{"t":"Confía en ti mismo: todo corazón vibra con esa cuerda de hierro.","a":"Ralph Waldo Emerson"},{"t":"Ningún viento es favorable para quien no sabe a qué puerto va.","a":"Séneca"},{"t":"Nadie tiene la vida resuelta: algunos solo lo disimulan mejor.","a":"Para pensar"},{"t":"De lo que no se puede hablar, hay que callar.","a":"Ludwig Wittgenstein"},{"t":"Yo soy yo y mi circunstancia, y si no la salvo a ella no me salvo yo.","a":"José Ortega y Gasset"},{"t":"Y sin embargo, se mueve.","a":"Galileo Galilei"},{"t":"La envidia es información: te muestra lo que quieres.","a":"Para pensar"},{"t":"La ciencia se hace con hechos como una casa con piedras, pero un montón de hechos no es ciencia.","a":"Henri Poincaré"},{"t":"Hay que tener caos dentro de sí para dar a luz una estrella danzante.","a":"Friedrich Nietzsche"},{"t":"La vida, si sabes usarla, es larga.","a":"Séneca"},{"t":"El que está en todas partes no está en ninguna.","a":"Séneca"},{"t":"No atribuyas a la maldad lo que se explica por descuido.","a":"Navaja de Hanlon"},{"t":"El scroll infinito tiene un final: tu tiempo.","a":"Para pensar"},{"t":"La esperanza es gran falsificadora de la verdad.","a":"Baltasar Gracián"},{"t":"Sin música, la vida sería un error.","a":"Friedrich Nietzsche"},{"t":"Hoy: escribe en el diario aunque sean dos líneas.","a":"Para hoy"},{"t":"Es imposible aprender lo que uno cree que ya sabe.","a":"Epicteto"},{"t":"Casi siempre perdonamos a quienes nos aburren, pero no a quienes aburrimos.","a":"La Rochefoucauld"},{"t":"Al que madruga, Dios lo ayuda.","a":"Refrán"},{"t":"Si algo te toma menos de dos minutos, hacerlo cuesta menos que recordarlo.","a":"Para pensar"},{"t":"Nombra tres cosas de hoy que darías por sentadas hasta que te faltaran.","a":"Para agradecer"},{"t":"Hacer, y hacer parecer.","a":"Baltasar Gracián"},{"t":"El trabajo se expande hasta llenar el tiempo disponible para terminarlo.","a":"Ley de Parkinson"},{"t":"Lo importante rara vez es urgente, y lo urgente rara vez es importante.","a":"Dwight D. Eisenhower"},{"t":"Al hombre se le puede quitar todo menos una cosa: elegir su actitud ante cualquier circunstancia.","a":"Viktor Frankl"},{"t":"Vísteme despacio, que tengo prisa.","a":"Refrán español"},{"t":"Hoy: ordena tu escritorio antes de partir.","a":"Para hoy"},{"t":"No pierdas más tiempo discutiendo cómo debe ser un hombre bueno. Sé uno.","a":"Marco Aurelio"},{"t":"¿Amas la vida? Entonces no malgastes el tiempo, que es de lo que está hecha.","a":"Benjamin Franklin"},{"t":"Lo que no me mata me hace más fuerte.","a":"Friedrich Nietzsche"},{"t":"La mosca que no quiere ser aplastada se pone justo sobre el matamoscas.","a":"Georg C. Lichtenberg"},{"t":"Hoy: termina el día anotando lo que harás mañana.","a":"Para hoy"},{"t":"Agradece tener algo que te preocupe: significa que te importa.","a":"Para agradecer"},{"t":"¿Qué persona hace tu semana un poco más liviana?","a":"Para agradecer"},{"t":"La perfección se alcanza no cuando no queda nada que añadir, sino cuando no queda nada que quitar.","a":"Antoine de Saint-Exupéry"},{"t":"No nos perturban las cosas, sino las opiniones que tenemos sobre ellas.","a":"Epicteto"},{"t":"Agradece a alguien hoy por algo concreto, no genérico.","a":"Para agradecer"},{"t":"Quien conoce a los demás es sabio; quien se conoce a sí mismo es iluminado.","a":"Lao Tse"},{"t":"¿Qué rincón de Concepción te gusta y no visitas hace tiempo?","a":"Para agradecer"},{"t":"Lo simple no es lo mismo que lo fácil.","a":"Para pensar"},{"t":"Nada es bueno ni malo; es el pensamiento el que lo hace así.","a":"William Shakespeare"},{"t":"Ordenar tu espacio es la forma más barata de ordenar tu cabeza.","a":"Para const LK=n=>'mp_'+(ST.uid?ST.uid.slice(0,8)+'_':'')+n;
const valOf=n=>n==='secret'?ST.secret:S[n];
function cacheLocal(n){try{localStorage.setItem(LK(n),JSON.stringify(valOf(n)))}catch(e){}}
function readLocal(){
  for(const n of DOCS){try{const r=localStorage.getItem(LK(n));S[n]=r?fill(n,JSON.parse(r)):clone(DEFAULTS[n])}catch(e){S[n]=clone(DEFAULTS[n])}}

function setSync(s,msg){
  const txt={ok:'Sincronizado',local:'Solo en este dispositivo',wait:'Conectando…',saving:'Guardando…',err:'Sin conexión: se sube cuando vuelva'}[s]||s;
  for(const id of ['sync','sync2']){const el=document.getElementById(id);if(!el)continue;el.dataset.s=s==='saving'?'wait':s;el.title=msg||txt;const sp=el.querySelector('span');if(sp)sp.textContent=msg||txt}
}
const busy=n=>ST.dirty[n]||ST.writing[n]||ST.timers[n];
const anyBusy=()=>ALL.some(busy);
function save(name){
  cacheLocal(name);
  if(ST.mode!=='cloud')return;
  ST.dirty[name]=true;clearTimeout(ST.timers[name]);
  ST.timers[name]=setTimeout(()=>{ST.timers[name]=null;flush(name)},600);
}
async function flush(name){
  if(ST.writing[name]||!ST.dirty[name]||ST.mode!=='cloud')return;
  ST.writing[name]=true;ST.dirty[name]=false;setSync('saving');
  const now=new Date().toISOString();
  let error=null;
  try{({error}=await sb.from('planner_docs').upsert({user_id:ST.uid,name,data:valOf(name),updated_at:now},{onConflict:'user_id,name'}))}catch(e){error=e}
  ST.writing[name]=false;
  if(error){ST.dirty[name]=true;setSync('err');return}
  ST.stamp[name]=now;
  if(ST.dirty[name]&&!ST.timers[name])flush(name);else if(!anyBusy())setSync('ok');
}
function retryDirty(){for(const n of ALL)if(ST.dirty[n]&&!ST.writing[n]&&!ST.timers[n])flush(n)}
async function pull(){
  if(ST.mode!=='cloud')return -1;
  let res;try{res=await sb.from('planner_docs').select('name,data,updated_at')}catch(e){res={error:e}}
  if(res.error){setSync('err');return -1}
  let changed=false;
  for(const row of res.data||[]){
    if(busy(row.name)||ST.stamp[row.name]===row.updated_at)continue;
    ST.stamp[row.name]=row.updated_at;
    if(row.name==='secret'){ST.secret=Object.assign({geminiKey:'',model:''},row.data||{});cacheLocal('secret');continue}
    if(!DEFAULTS[row.name])continue;
    const next=fill(row.name,row.data);
    if(JSON.stringify(next)!==JSON.stringify(S[row.name])){S[row.name]=next;cacheLocal(row.name);changed=true}
  }
  if(!anyBusy())setSync('ok');
  if(changed)scheduleRender();
  return (res.data||[]).length;
}
async function startCloud(user){
  hideLogin();
  ST.mode='cloud';ST.uid=user.id;ST.email=user.email||'';
  readLocal();render();setSync('wait');
  const n=await pull();
  if(n===0){
    // Primera vez en la nube: sube lo que hubiera en "modo sin cuenta" de este dispositivo
    let any=false;
    for(const d of ALL){try{const r=localStorage.getItem('mp_'+d);if(r){if(d==='secret')ST.secret=Object.assign(ST.secret,JSON.parse(r));else S[d]=fill(d,JSON.parse(r));any=true}}catch(e){}}
    for(const d of ALL)save(d);
    if(any)render();
  }
}

async function doLogin(fd){
  const mode=loginMode;
  const email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('password')||'');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showLogin('Ese correo no parece válido. Revísalo.',email);return}
  if(password.length<6){showLogin('La contraseña debe tener al menos 6 caracteres.',email);return}
  const btns=document.querySelectorAll('#login button');btns.forEach(b=>b.disabled=true);
  try{
    if(mode==='up'){
      const {data,error}=await sb.auth.signUp({email,password});
      if(error)throw error;
      try{localStorage.setItem('mp_hasacct','1')}catch(e){}
      if(data.session)await startCloud(data.user);else{loginMode='in';showLogin('Cuenta creada. Ahora entra con tu correo y contraseña.',email)}
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error)throw error;
      try{localStorage.setItem('mp_hasacct','1')}catch(e){}
      await startCloud(data.user);
    }
  }catch(e){
    const m=String(e&&e.message||'');
    if(/already registered|already been registered/i.test(m)){loginMode='in';showLogin('Ese correo ya tiene cuenta. Escribe tu contraseña para entrar.',email);return}
    if(/Invalid login/i.test(m)){showLogin('Correo o contraseña incorrectos. Si es tu primera vez, toca "Crear cuenta".',email);return}
    showLogin(!navigator.onLine?'Sin internet. Prueba de nuevo con conexión.':/rate limit/i.test(m)?'Demasiados intentos seguidos. Espera un minuto.':'No se pudo: '+m,email);
  }
}

function dueChip(k){
  const d=diffDays(k);
  if(d<0)return`<span class="chip late">Atrasada ${-d} d</span>`;
  if(d===0)return`<span class="chip today">Hoy</span>`;
  if(d===1)return`<span class="chip">Mañana</span>`;
  const dt=parseKey(k);return`<span class="chip">${DS[dow(dt)]} ${dt.getDate()}</span>`;
}
function catChip(k){const c=cat(k);return`<span class="chip"><i class="dot" style="background:${c.c}"></i>${c.n}</span>`}
function taskRow(t){

  <div class="task-main"><span class="task-title">${esc(t.title)}</span><div class="chips">${prio}${t.cat?catChip(t.cat):''}${t.due&&!t.done?dueChip(t.due):''}</div></div>

function dayItems(k){
  const d=parseKey(k),wd=dow(d);
  const r=(S.agenda.routine||[]).filter(b=>(b.days||[]).includes(wd)).map(b=>({id:b.id,kind:'routine',title:b.title,start:mins(b.start),end:mins(b.end),cat:b.cat,place:b.place,opt:!!b.opt}));
  const e=(S.agenda.events||[]).filter(x=>x.date===k).map(x=>({id:x.id,kind:'event',title:x.title,start:mins(x.time),end:x.time?mins(x.time)+60:null,cat:x.cat,place:x.place}));
  return r.concat(e).sort((a,b)=>(a.start??-1)-(b.start??-1));

function streak(h){
  const log=h.log||{};let n=0;let d=new Date();

  return n;
}

function ringSvg(p,color){const C=2*Math.PI*15;return`<svg class="ring" viewBox="0 0 38 38"><circle cx="19" cy="19" r="15" fill="none" stroke="#2b2244" stroke-width="5"/><circle cx="19" cy="19" r="15" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,p))}" transform="rotate(-90 19 19)"/></svg>`}

function vRoutine(){

  const axis=[];for(let m=lo;m<=hi;m+=60)axis.push(`<span style="top:${(m-lo)*PX}px">${pad(m/60)}:00</span>`);
  const cols=DAYS.map((d,i)=>{
    const dayB=R.filter(b=>(b.days||[]).includes(i)).map(b=>({b,s:mins(b.start),e:mins(b.end)})).sort((x,y)=>x.s-y.s||y.e-x.e);
    const laneEnd=[];for(const x of dayB){let l=laneEnd.findIndex(t=>t<=x.s);if(l<0){l=laneEnd.length;laneEnd.push(0)}laneEnd[l]=x.e;x.l=l}
    for(const x of dayB){let n=1;for(const y of dayB)if(y!==x&&y.s<x.e&&x.s<y.e)n=Math.max(n,Math.max(x.l,y.l)+1);x.n=n}
    const bl=dayB.map(({b,s,e,l,n})=>`<button type="button" class="blk${b.opt?' opt':''}" data-act="blockInfo" data-id="${b.id}" style="top:${(s-lo)*PX}px;height:${Math.max(22,(e-s)*PX-2)}px;left:calc(${l*100/n}% + 3px);width:calc(${100/n}% - 6px);right:auto;background-color:${cat(b.cat).c}"><b>${esc(b.title)}</b>${b.start}–${b.end}${b.opt?'<span class="opt-tag">Opc.</span>':''}${b.place?'<br>'+esc(b.place):''}</button>`).join('');
    return`<div class="wk-col${i===td?' today':''}" style="height:${H}px;--hour:${hour}px">${bl}</div>`;

  <div class="mday"><div class="daytabs" role="group" aria-label="Día">${DS.map((d,i)=>`<button type="button" data-act="mDay" data-v="${i}" aria-pressed="${i===mobileDay}">${d}</button>`).join('')}</div>
  <div class="tl" style="margin-top:12px">${dayList.map(b=>`<div class="tl-item${b.opt?' opt':''}"><div class="tl-time num">${b.start}</div><div class="tl-bar" style="background:${cat(b.cat).c}"></div><div class="tl-body"><div><b>${esc(b.title)}</b><small>${b.start}–${b.end}${b.opt?' · Opcional':''}${b.place?' · '+esc(b.place):''}</small></div><button type="button" class="icon-btn" data-act="del" data-doc="agenda" data-list="routine" data-id="${b.id}" aria-label="Eliminar bloque">${ic('x')}</button></div></div>`).join('')||'<div class="empty">Nada este día.</div>'}</div></div></div>

function vCalendar(){

  ${!list.length&&!dueT.length?'<div class="empty">Día libre.</div>':''}</div>

let habWeek=0;

function mkRng(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function seedOf(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const MN='−';
const nm=n=>(n<0?MN+Math.abs(n):String(n));
function frc(p,q){if(q<0){p=-p;q=-q}const g=(a,b)=>b?g(b,a%b):Math.abs(a);const d=g(p,q)||1;p/=d;q/=d;return q===1?nm(p):(p<0?MN:'')+Math.abs(p)+'/'+q}
const sup=e=>`<sup>${e}</sup>`;
// término con coeficiente: coef(3,'x')="3x", coef(-1,'x')="−x"
const coef=(a,v)=>a===1?v:a===-1?MN+v:nm(a)+v;
// suma de términos ya formateados con su signo
function terms(list){let s='';for(const [c,body] of list){if(c===0)continue;const abs=Math.abs(c);const t=body===''?String(abs):(abs===1?body:abs+body);if(!s)s=(c<0?MN:'')+t;else s+=(c<0?' '+MN+' ':' + ')+t}return s||'0'}
const lin=(a,b,v='x')=>terms([[a,v],[b,'']]);
const poly2=(a,b,c)=>terms([[a,'x'+sup(2)],[b,'x'],[c,'']]);
const shift=(h)=>h===0?'x':h>0?`x ${MN} ${h}`:`x + ${-h}`; // x − h
const plusK=k=>k===0?'':k>0?` + ${k}`:` ${MN} ${-k}`;
const logb=(b,arg)=>b===10?`log(${arg})`:`log<sub>${b}</sub>(${arg})`;
const pw=(b,e)=>`${b}${sup(e)}`;
const iv=(a,b,lc,rc)=>`${lc?'[':'('}${a===-Infinity?MN+'∞':nm(a)}, ${b===Infinity?'∞':nm(b)}${rc?']':')'}`;

 steps:[`(f ∘ g)(${nm(k)}) significa f(g(${nm(k)})): primero se aplica g y al resultado se le aplica f.`,`g(${nm(k)}) = (${nm(k)})${sup(2)}${plusK(c)} = ${k*k}${plusK(c)} = ${nm(gk)}`,`f(${nm(gk)}) = ${nm(a)}·(${nm(gk)})${plusK(b)} = ${nm(a*gk)}${plusK(b)} = <b>${nm(res)}</b>`],

function mkR(seed){const r=mkRng(seed);const R={r,i:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:arr=>arr[Math.floor(r()*arr.length)],nz:(a,b)=>{let v;do{v=a+Math.floor(r()*(b-a+1))}while(v===0);return v},shuffle:arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}};return R}
function makeProblem(seed,topic,level){
  let pool=MGEN.filter(g=>(!topic||g.t===topic)&&(!level||g.l===+level));if(!pool.length)pool=MGEN.filter(g=>!topic||g.t===topic);if(!pool.length)pool=MGEN;
  const R=mkR(seedOf('m'+seed));R.r();R.r();const G=pool[Math.floor(R.r()*pool.length)];const p=G.g(R);p.t=G.t;p.l=G.l;p.seed=seed;return p;
}
function parseNumStr(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/^x\s*=\s*|^y\s*=\s*/i,'').replace(/\s/g,'');if(!s)return NaN;
  const m=s.match(/^(-?\d+(?:[.,]\d+)?)\/(-?\d+(?:[.,]\d+)?)$/);if(m){const d=parseFloat(m[2].replace(',','.'));return d?parseFloat(m[1].replace(',','.'))/d:NaN}
  if(!/^-?\d+(?:[.,]\d+)?$/.test(s))return NaN;return parseFloat(s.replace(',','.'))}
function splitAns(s){s=String(s).replace(/[()\[\]{}]/g,' ');let parts=s.split(/;|\sy\s|\s+e\s+/i);if(parts.length===1&&/,\s/.test(s))parts=s.split(/,\s*/);return parts.map(x=>x.trim()).filter(Boolean)}
const near=(a,b)=>Math.abs(a-b)<1e-6;
function checkAnswer(p,raw){
  if(p.kind==='mc')return Number(raw)===p.ans;
  if(p.kind==='num'){const v=parseNumStr(raw);return !isNaN(v)&&near(v,p.ans)}
  const parts=splitAns(raw).map(parseNumStr);if(parts.some(isNaN))return false;
  if(p.kind==='pair')return parts.length===2&&near(parts[0],p.ans[0])&&near(parts[1],p.ans[1]);
  const want=[...new Set(p.ans)].sort((a,b)=>a-b),got=[...new Set(parts.map(x=>Math.round(x*1e6)/1e6))].sort((a,b)=>a-b);
  return want.length===got.length&&want.every((w,i)=>near(w,got[i]));
}
function ansText(p){if(p.kind==='mc')return p.opts[p.ans];if(p.kind==='num')return frcN(p.ans);if(p.kind==='pair')return frcN(p.ans[0])+'; '+frcN(p.ans[1]);return [...new Set(p.ans)].sort((a,b)=>a-b).map(frcN).join('; ')}
function frcN(v){if(Number.isInteger(v))return nm(v);for(let q=2;q<=12;q++){const p=Math.round(v*q);if(near(p/q,v))return frc(p,q)}return nm(+v.toFixed(3))}

function mRecord(ok,given){

  const W=r.width,H=r.height;let seed=11;const rnd=()=>{seed=seed*16807%2147483647;return(seed-1)/2147483646};
  const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#110a28');sky.addColorStop(.42,'#36206b');sky.addColorStop(.75,'#8f4590');sky.addColorStop(1,'#ff9466');
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  for(let i=0;i<W/5;i++){const s=rnd()<.08?2:1;g.fillStyle=`rgba(255,255,255,${.25+rnd()*.6})`;g.fillRect(rnd()*W,rnd()*H*.55,s,s)}
  const mx=W*(W<600?.86:.62),my=H*.26,mr=Math.max(14,Math.min(26,H*.11));
  const gl=g.createRadialGradient(mx,my,mr*.6,mx,my,mr*5);gl.addColorStop(0,'rgba(255,214,245,.35)');gl.addColorStop(1,'rgba(255,214,245,0)');g.fillStyle=gl;g.fillRect(mx-mr*5,my-mr*5,mr*10,mr*10);
  g.fillStyle='#ffeaf7';g.beginPath();g.arc(mx,my,mr,0,Math.PI*2);g.fill();
  const layer=(minH,maxH,col,winP,wMin,wMax)=>{let x=-8;while(x<W+8){const w=wMin+rnd()*(wMax-wMin),h=minH+rnd()*(maxH-minH);g.fillStyle=col;g.fillRect(x,H-h,w,h);if(rnd()<.22)g.fillRect(x+w*.45,H-h-12,2,12);
    for(let wy=H-h+6;wy<H-4;wy+=7)for(let wx=x+4;wx<x+w-4;wx+=6)if(rnd()<winP){g.fillStyle=rnd()<.7?'rgba(255,198,120,.9)':'rgba(255,140,220,.85)';g.fillRect(wx,wy,2.4,3.4)}
    x+=w+1+rnd()*3}};
  layer(H*.28,H*.62,'#2b1752',.07,16,38);

  const f=g.createLinearGradient(0,H*.72,0,H);f.addColorStop(0,'rgba(12,9,22,0)');f.addColorStop(1,'rgba(12,9,22,.85)');g.fillStyle=f;g.fillRect(0,0,W,H);
}

async function geminiJSON(prompt,signal){

  }
  throw last;
}

- "events": algo que ocurre un día específico (prueba, certamen, control, entrega, reunión, cumpleaños, cita). "time" en HH:MM 24 h si lo dijo, si no null.
- Por cada prueba, certamen, control o entrega agrega además una task "Estudiar para …" o "Terminar …" con due = el día anterior y prio "alta" (si ese día ya pasó, usa hoy).
- "routine": solo algo que se repite todas las semanas con horario. days: 0=lunes … 6=domingo. opt true si dice que es opcional.
- "habits": solo si pide crear un hábito diario nuevo.

const isD=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);

    it.push({kind:'task',on:true,label:title,sub:[due?'Para el '+fmtD(due):{now:'Para hoy',week:'Esta semana',later:'Más adelante'}[bucket],'Prioridad '+prio,cat(okCat(t.cat)).n].join(' · '),data:{title,due,bucket,prio,cat:okCat(t.cat),done:false,created:today()}})}

}

  else if(a==='toggleHabit'){const h=list('habits','items').find(x=>x.id===id);if(!h)return;h.log=h.log||{};const k=b.dataset.d;if(h.log[k])delete h.log[k];else h.log[k]=true;save('habits');render()}
  else if(a==='habWeek'){habWeek=Math.min(0,habWeek+Number(v));render()}
  else if(a==='goalStep'){const g=list('goals','items').find(x=>x.id===id);if(!g)return;g.progress=Math.max(0,Math.min(100,(+g.progress||0)+Number(v)));save('goals');render();if(g.progress===100)toast('¡Meta cumplida! 🎉')}
  else if(a==='schedTab'){schedTab=v;render()}
  else if(a==='mDay'){mobileDay=Number(v);render()}
  else if(a==='calNav'){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+Number(v),1);render()}
  else if(a==='calToday'){const d=new Date();calMonth=new Date(d.getFullYear(),d.getMonth(),1);calSel=today();render()}
  else if(a==='calDay'){calSel=v;const d=parseKey(v);if(d.getMonth()!==calMonth.getMonth())calMonth=new Date(d.getFullYear(),d.getMonth(),1);render()}
  else if(a==='blockInfo'){const bl=list('agenda','routine').find(x=>x.id===id);if(!bl)return;openModal(`<h2>${esc(bl.title)}</h2><p>${(bl.days||[]).sort().map(i=>DAYS[i]).join(', ')} · ${bl.start}–${bl.end}${bl.place?' · '+esc(bl.place):''}</p><p>${catChip(bl.cat)} ${bl.opt?'<span class="chip opt">Opcional</span>':'<span class="chip">Obligatoria</span>'}</p><button class="btn sec" type="button" data-act="toggleOpt" data-id="${bl.id}">Marcar como ${bl.opt?'obligatoria':'opcional'}</button><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn danger" type="button" data-act="del" data-doc="agenda" data-list="routine" data-id="${bl.id}">Eliminar bloque</button><button class="btn sec" type="button" data-act="closeModal">Cerrar</button></div>`)}
  else if(a==='toggleOpt'){const bl=list('agenda','routine').find(x=>x.id===id);if(!bl)return;bl.opt=!bl.opt;save('agenda');closeModal();render()}
  else if(a==='fStart'){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(err){}if(F.running){F.running=false;F.left=Math.max(0,Math.round((F.end-Date.now())/1000))}else{F.running=true;F.end=Date.now()+F.left*1000}fUI()}
  else if(a==='fReset'){F.running=false;F.mode='focus';F.left=F.preset[0]*60;fUI()}
  else if(a==='fPreset'){F.preset=v.split('-').map(Number);F.running=false;F.mode='focus';F.left=F.preset[0]*60;fUI()}
  else if(a==='useLocal')startLocal();
  else if(a==='lMode'){const em=($('#lEmail')||{}).value||'';loginMode=v;showLogin('',em)}
  else if(a==='signOut'){(async()=>{try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem('mp_mode')}catch(e){}location.reload()})()}
  else if(a==='goLogin'){try{localStorage.removeItem('mp_mode')}catch(e){}closeModal();showLogin()}
  else if(a==='qNext'){const L=allQuotes();let n;do{n=Math.floor(Math.random()*L.length)}while(L.length>1&&n===qIdx%L.length);qIdx=n;render()}
  else if(a==='qFav'){const L=allQuotes();const q=L[qIdx%L.length];S.meta.quotes=S.meta.quotes||{};const f=new Set(S.meta.quotes.fav||[]);const k=qKey(q);if(f.has(k))f.delete(k);else f.add(k);S.meta.quotes.fav=[...f];save('meta');render()}
  else if(a==='qDel'){const c=((S.meta.quotes||{}).custom)||[];S.meta.quotes.custom=c.filter(x=>x.id!==id);qIdx=0;save('meta');render()}
  else if(a==='mPick'){if(MS.done)return;mRecord(Number(v)===MS.p.ans,v)}
  else if(a==='mFlip'){MS.flipped=!MS.flipped;const el=$('#mFlip');if(el)el.classList.toggle('flipped',MS.flipped)}
  else if(a==='mNew'){MS.p=null;render()}
  else if(a==='mMode'){if(MS.mode!==v){MS.mode=v;MS.p=null;render()}}
  else if(a==='openAssistant')openAssistant();
  else if(a==='aMic'){if(!SR)return;if(micActive())micStop();else{const t=$('#aText');if(t)A.text=t.value;micStart()}}
  else if(a==='aGo')aGo();
  else if(a==='aCancel'){if(A.ctl)A.ctl.abort()}
  else if(a==='aBack'){A.items=null;renderA()}
  else if(a==='aClear'){A.text='';renderA()}
  else if(a==='aApply')aApply();
  else if(a==='openSettings')openModal(settingsHtml());
  else if(a==='closeModal')closeModal();
  else if(a==='copyBackup'){const txt=JSON.stringify(S);navigator.clipboard.writeText(txt).then(()=>toast('Respaldo copiado'),()=>{$('#restoreTxt').value=txt;$('#restoreTxt').select();toast('Selecciona y copia el texto del recuadro')})}
  else if(a==='restoreBackup'){try{const o=JSON.parse($('#restoreTxt').value);for(const n of DOCS)if(o[n]){S[n]=fill(n,o[n]);save(n)}closeModal();render();toast('Respaldo restaurado')}catch(err){toast('Ese texto no es un respaldo válido')}}
});
document.addEventListener('change',e=>{
  const r=e.target.closest('[data-goal-range]');
  if(r){const g=list('goals','items').find(x=>x.id===r.dataset.goalRange);if(g){g.progress=Number(r.value);save('goals');render()}}
});
document.addEventListener('input',e=>{if(e.target.matches('[data-notes]')){S.meta.notes=e.target.value;save('meta')}else if(e.target.matches('[data-a-text]')){A.text=e.target.value}});
document.addEventListener('change',e=>{const f=e.target.closest('[data-m-filter]');if(f){MS[f.dataset.mFilter]=f.value;MS.p=null;render();return}const c=e.target.closest('[data-a-item]');if(c&&A.items){A.items[+c.dataset.aItem].on=c.checked}});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const fd=new FormData(f),g=k=>(fd.get(k)||'').toString().trim(),kind=f.dataset.form;
  if(kind==='login'){doLogin(fd);return}
  if(kind==='mAnswer'){const raw=g('ans');if(!raw||MS.done)return;mRecord(checkAnswer(MS.p,raw),raw);return}
  if(kind==='quickGoal'){const t=g('title');if(!t)return;list('goals','items').push({id:newId(),title:t,desc:'',cat:'personal',deadline:null,progress:0});save('goals');render();return}
  if(kind==='quickTask'){const t=g('title');if(!t)return;list('tasks','items').push({id:newId(),title:t,bucket:'now',prio:'media',cat:'personal',due:null,done:false,created:today()});save('tasks');render();const q=$('#quickTitle');if(q)q.focus()}
  else if(kind==='addTask'){list('tasks','items').push({id:newId(),title:g('title'),bucket:g('bucket')||'now',prio:g('prio')||'media',cat:g('cat'),due:g('due')||null,done:false,created:today()});save('tasks');render();toast('Tarea agregada');$('#tTitle')&&$('#tTitle').focus()}
  else if(kind==='addBlock'){const days=fd.getAll('day').map(Number);if(!days.length){toast('Elige al menos un día');return}if(mins(g('end'))<=mins(g('start'))){toast('La hora de término debe ser después del inicio');return}list('agenda','routine').push({id:newId(),title:g('title'),days,start:g('start'),end:g('end'),cat:g('cat'),place:g('place'),opt:g('opt')==='1'});save('agenda');render();toast('Bloque agregado a tu semana')}
  else if(kind==='addEvent'){list('agenda','events').push({id:newId(),title:g('title'),date:calSel,time:g('time')||null,cat:g('cat')});save('agenda');render();toast('Evento agregado')}
  else if(kind==='addHabit'){list('habits','items').push({id:newId(),name:g('name'),color:g('color')||HAB_COLORS[0],log:{}});save('habits');render();toast('Hábito creado. A darle.')}
  else if(kind==='addGoal'){list('goals','items').push({id:newId(),title:g('title'),desc:g('desc'),cat:g('cat'),deadline:g('deadline')||null,progress:0});save('goals');render();toast('Meta agregada')}
  else if(kind==='addQuote'){S.meta.quotes=S.meta.quotes||{};S.meta.quotes.custom=S.meta.quotes.custom||[];S.meta.quotes.custom.push({id:newId(),t:g('t'),a:g('a')});qIdx=allQuotes().length-1;save('meta');render();toast('Frase agregada')}
  else if(kind==='addEntry'){list('journal','items').push({id:newId(),date:g('date')||today(),mood:Number(g('mood'))||3,text:g('text'),good:g('good'),ts:Date.now()});save('journal');render();toast('Entrada guardada')}
  else if(kind==='settings'){S.meta.name=g('name');S.meta.focusGoal=Math.max(15,Number(g('focusGoal'))||120);save('meta');const k=g('geminiKey'),md=g('model');if(k!==ST.secret.geminiKey||md!==ST.secret.model){ST.secret.geminiKey=k;ST.secret.model=md;save('secret')}closeModal();render();toast('Ajustes guardados')}
});

boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
